name: Ruffy Visuals Build

on:
  push:
    branches: [ main, 'feature/ruffy-visuals-2.1-spotify-polish', 'feature/ruffy-visuals-2.2-performance', 'feature/ruffy-visuals-2.3-perfect-round-ui', 'feature/ruffy-visuals-2.4-control-center-redesign', 'feature/ruffy-visuals-2.5-exact-dashboard-home', 'feature/ruffy-visuals-2.6-cosmetics' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build remapped mod JAR
        run: gradle build --no-daemon

      - name: Verify remapped JAR contents
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'ruffy-visuals-*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$jar_path"
          unzip -l "$jar_path" | grep -q 'fabric.mod.json'
          unzip -l "$jar_path" | grep -q 'ruffyclient.mixins.json'
          unzip -l "$jar_path" | grep -q 'ruffyclient.refmap.json'
          unzip -l "$jar_path" | grep -q 'de/ruffy/client/RuffyAnimation.class'
          unzip -l "$jar_path" | grep -q 'de/ruffy/client/RuffyRoundedUi.class'
          unzip -l "$jar_path" | grep -q 'de/ruffy/client/RuffyGalaxyUi.class'
          unzip -l "$jar_path" | grep -q 'de/ruffy/client/RuffyVisualEffects.class'
          unzip -l "$jar_path" | grep -q 'de/ruffy/client/RuffyFeature.class'
          unzip -l "$jar_path" | grep -q 'de/ruffy/client/RuffySpotify.class'
          unzip -l "$jar_path" | grep -q 'de/ruffy/client/RuffySpotifyScreen.class'
          unzip -p "$jar_path" fabric.mod.json | grep -q '"minecraft": "~1.21.11"'
          unzip -p "$jar_path" fabric.mod.json | grep -q '"version": "2.6.0"'
          echo "Verified mod archive: $jar_path"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ruffy-visuals-1.21.11
          path: |
            build/libs/ruffy-visuals-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
